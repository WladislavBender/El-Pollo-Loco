<!DOCTYPE html>
<html translate="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="./styles/assets.css">

    <link rel="icon" type="image/x-icon" href="./img/favicon.png">
    <title>El Pollo Loco</title>

    <script src="models/drawable-object.class.js"></script>
    <script src="models/moveable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/chicken_small.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/collectable-object.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="models/world.class.js"></script>
    <script src="js/game.js"></script>
</head>

<body>
    <div id="content">
        <h1>El Pollo Loco</h1>

        <div id="canvas-container">
            <canvas id="canvas" width="720" height="480"></canvas>

            <!-- Sound Button -->
            <button id="sound-btn" onclick="toggleSound()">🔊</button>

            <!-- Pause Button -->
            <button id="pause-btn" class="hidden" onclick="togglePause()">⏸</button>

            <!-- Pause Overlay -->
            <div id="pause-overlay" class="hidden">
                <div class="overlay-content">
                    <button onclick="resumeGame()">Continue</button>
                    <button onclick="restartGame()">Restart</button>
                    <button onclick="returnToMenu()">Menu</button>
                    <button onclick="openSettings('pause-overlay')">Settings</button>
                </div>
            </div>

            <!-- Fullscreen Button -->
            <button id="fullscreen-btn" onclick="toggleFullscreen()">⛶</button>

            <!-- Mobile Controls -->
            <div id="mobile-controls" class="hidden">
                <div id="left-controls">
                    <button id="btn-left">⬅️</button>
                    <button id="btn-right">➡️</button>
                </div>
                <div id="right-controls">
                    <button id="btn-jump">⤒</button>
                    <button id="btn-throw">🥤</button>
                </div>
            </div>
        </div>

        <!-- Startscreen -->
        <div id="start-screen">
            <div class="overlay-content">
                <button id="start-btn" onclick="startGame()">Start</button>
                <button id="start-btn" onclick="openSettings('start-screen')">Settings</button>
            </div>
        </div>

        <!-- Endscreen -->
        <div id="end-screen" class="hidden">
            <div class="overlay-content">
                <button id="restart-btn" onclick="restartGame()">Restart</button>
                <button id="restart-btn" onclick="returnToMenu()">Menu</button>
                <button id="restart-btn" onclick="openSettings('end-screen')">Settings</button>
            </div>
        </div>

        <!-- Settings Overlay -->
        <div id="settings-overlay" class="hidden">
            <div class="overlay-content">
                <h2>Einstellungen</h2>
                <label for="volume-slider">🔊 Lautstärke</label><br>
                <input type="range" id="volume-slider" min="0" max="1" step="0.01">
                <br><br>
                <button onclick="closeSettings()">Back</button>
            </div>
        </div>

        <!-- Rotate Overlay -->
        <div id="rotate-overlay" class="hidden">
            <div class="overlay-message">
                <p>📱 Please rotate your device to landscape mode.</p>
            </div>
        </div>
    </div>

    <div class="instructions">
        <p>Movement: LEFT & RIGHT Arrows</p>
        <p>Jump: SPACE</p>
        <p>Throw: D</p>
    </div>

    <footer>
        <span>© 2025 von Wladislav Bender</span>
        <a href="./pages/impressum.html">Impressum</a>
    </footer>
</body>
</html>
